<header class="global-header">
  <a href="https://aganitha.ai/" class="logo-pill" target="_blank">
    <img src="{{ site.logo }}" alt="Aganitha AI Logo">
  </a>
  
  {% assign toggle_id = include.toggle_id | default: 'menu-toggle' %}
  <input type="checkbox" id="{{ toggle_id }}" class="menu-toggle">
  <label for="{{ toggle_id }}" class="menu-icon">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <nav>
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' or page.url == '/index.html' %}class="active"{% endif %}>Gallery</a>
    <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about/' %}class="active"{% endif %}>About</a>
    <a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact/' %}class="active"{% endif %}>Contact</a>
  </nav>
</header>
