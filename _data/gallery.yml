- system_type: "Transcription Factors and Cell Fate"
  videos:
    - title: "How OCT-4 reads DNA"
      description: "The bipartite POU domain of OCT-4 gripping both faces of the DNA helix, with the invariant asparagine that hydrogen-bonds adenine in the major groove"
      youtube_id: "NbJJe7P4Nuw"

- system_type: "Ligand Unbinding Kinetics"
  videos:
    - title: "A Factor Xa inhibitor leaving its pocket"
      description: "A complete unbinding event with timestamps — an anticoagulant breaking its first contacts, holding at a long-lived intermediate, moving back toward the protein, then releasing"
      youtube_id: "iSxudu2GQCI"
