# EyeCue gallery — 4 videos across 3 live cards.
#
# The "Oncology: Targeting Mitosis" card (KIF18A docking) is commented out
# below. The video is rendered and ready; it only needs its YouTube ID.
# To bring it back: uncomment the block and replace YT_ID_KIF18A_DOCKING with
# the real 11-char ID. Card thumbnails come from
# https://img.youtube.com/vi/<id>/hqdefault.jpg, so an unfilled ID renders a
# blank image and an embed that will not play.

- system_type: "GPCR Drug Discovery"
  videos:
    - title: "Druggability of the S1PR2 pocket"
      description: "Three P2Rank pockets scored side by side — 0.991 against 0.151 and 0.069 — resolving to a single buried transmembrane cavity and the four ligandable cysteines that line it"
      youtube_id: "1H0VWWrk_vs"
    - title: "A receptor that moves everywhere except its pocket"
      description: "Fifty thousand frames of S1P bound to S1PR2, where four contacts hold in every single frame and the receptor turns out to be flexible everywhere except the site that matters"
      youtube_id: "SP1hRgdt5oM"

