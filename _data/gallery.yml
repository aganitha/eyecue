- system_type: "S1PR2: druggability and dynamics"
  videos:
    - title: "Druggability assessment of the S1PR2 pocket"
      description: "Evaluating the S1PR2 transmembrane pocket for small-molecule and covalent drug design, highlighting the high-confidence druggable Pocket 1 and its ligandable cysteines"
