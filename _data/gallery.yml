    - title: "Molecular dynamics of the S1PR2-S1P complex"
      description: "Trajectory of the S1PR2 receptor bound to its cognate ligand S1P, showing the key hydrophobic contacts, hydrogen bonds and the ARG97 salt bridge that stabilise the complex"
      youtube_id: "PLACEHOLDER_S1PR2_MD" # TODO: replace with actual YouTube ID
